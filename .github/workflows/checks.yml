name: Static and nginx checks
on: [push, pull_request, workflow_dispatch]
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y shellcheck curl ca-certificates python3 openssl nginx libnginx-mod-stream certbot dnsutils iproute2 util-linux nftables kmod fail2ban python3-systemd
      - name: Record target and dependency versions
        run: |
          cat /etc/os-release
          python3 --version
          nginx -v
          certbot --version
          nft --version
          systemctl --version | head -1
      - run: find . -name '*.sh' -exec bash -n {} \;
      - run: shellcheck -S warning -e SC1090,SC1091,SC2034 $(find . -name '*.sh')
      - run: python3 -m unittest discover -s tests -v
      - run: sudo unshare --net bash tests/firewall-netns.sh
      - name: Render and validate actual nginx configuration
        shell: bash
        run: |
          mkdir -p /tmp/single443-test
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=web.example.com -keyout /tmp/single443-test/privkey.pem -out /tmp/single443-test/fullchain.pem
          python3 tests/render_fixtures.py /tmp/single443-test AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB
          cat > /tmp/single443-test/nginx.conf <<'EOF'
          include /etc/nginx/modules-enabled/*.conf;
          pid /tmp/single443-test/nginx.pid;
          error_log /tmp/single443-test/error.log;
          events {}
          http { include /tmp/single443-test/web.conf; }
          include /tmp/single443-test/stream.conf;
          EOF
          sudo nginx -t -c /tmp/single443-test/nginx.conf
      - name: Real upstream 3.8.5 AmneziaWG API smoke test
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/single443-api
          curl -fLsS --retry 3 https://api.github.com/repos/MHSanaei/3x-ui/releases/tags/v3.8.5 -o /tmp/single443-api/release.json
          curl -fLsS --retry 3 https://github.com/MHSanaei/3x-ui/releases/download/v3.8.5/x-ui-linux-amd64.tar.gz -o /tmp/single443-api/x-ui-linux-amd64.tar.gz
          python3 lib/engine.py verify-release /tmp/single443-api/x-ui-linux-amd64.tar.gz /tmp/single443-api/release.json
          tar -xzf /tmp/single443-api/x-ui-linux-amd64.tar.gz -C /tmp/single443-api
          sudo mkdir -p /etc/x-ui
          cd /tmp/single443-api/x-ui
          sudo ./x-ui migrate >/dev/null
          sudo ./x-ui setting -port 2053 -listenIP 127.0.0.1 -webBasePath /ci-test/ -username ci-user -password ci-password-only >/dev/null
          sudo ./x-ui > /tmp/single443-api/panel.log 2>&1 &
          panel_pid=$!
          trap 'sudo kill "$panel_pid" 2>/dev/null || true' EXIT
          cd "$GITHUB_WORKSPACE"
          sudo python3 tests/awg-api-smoke.py
      - name: BBR and fail2ban setup with real nftables actions
        shell: bash
        run: sudo bash tests/tuning-smoke.sh
      - name: Install and verify maintenance timer without running cleanup
        shell: bash
        run: |
          sudo bash -c 'set -Eeuo pipefail; ROOT="$PWD"; source lib/common.sh; source lib/maintenance.sh; mkdir -p /etc/single443; install_maintenance; install_maintenance; systemctl is-enabled single443-maintenance.timer; systemctl is-active single443-maintenance.timer'
